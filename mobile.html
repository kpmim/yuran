<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Yuran Petanque 2025–2026</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  /* NIGHT MODE (default) */
  --bg:#12152e; --bg2:#181c38; --bg3:#1e2340; --bg4:#232848;
  --surface:#272c52; --surface2:#2e3460;
  --accent:#ff6b6b; --accent2:#ff4757; --accent-dim:rgba(255,107,107,0.12); --accent-glow:rgba(255,107,107,0.35);
  --gold:#ffc947; --gold-dim:rgba(255,201,71,0.12);
  --red:#ff4d6d; --red-dim:rgba(255,77,109,0.12);
  --blue:#4d9fff; --blue-dim:rgba(77,159,255,0.1);
  --text:#eef0ff; --text2:#8b90c4; --text3:#3d4475;
  --border:rgba(255,255,255,0.07); --border2:rgba(255,255,255,0.13);
  --font:'Sora',sans-serif; --mono:'JetBrains Mono',monospace;
  --r:14px; --r2:20px; --r3:28px;
}
/* LIGHT THEMES */
body.day-mint {
  --bg:#f7f7f8; --bg2:#efefef; --bg3:#ffffff; --bg4:#f2f2f2;
  --surface:#ffffff; --surface2:#f7f7f8;
  --accent:#c0000d; --accent2:#9a0009; --accent-dim:rgba(192,0,13,0.08); --accent-glow:rgba(192,0,13,0.25);
  --gold:#c07000; --gold-dim:rgba(192,112,0,0.12);
  --red:#c0000d; --red-dim:rgba(192,0,13,0.1);
  --blue:#1d4ed8; --blue-dim:rgba(29,78,216,0.1);
  --text:#111111; --text2:#555555; --text3:#bbbbbb;
  --border:rgba(0,0,0,0.08); --border2:rgba(0,0,0,0.15);
}
body.day-sky {
  --bg:#f7f7f8; --bg2:#efefef; --bg3:#ffffff; --bg4:#f2f2f2;
  --surface:#ffffff; --surface2:#f7f7f8;
  --accent:#c0000d; --accent2:#9a0009; --accent-dim:rgba(192,0,13,0.08); --accent-glow:rgba(192,0,13,0.25);
  --gold:#c07000; --gold-dim:rgba(192,112,0,0.12);
  --red:#c0000d; --red-dim:rgba(192,0,13,0.1);
  --blue:#1d4ed8; --blue-dim:rgba(29,78,216,0.1);
  --text:#111111; --text2:#555555; --text3:#bbbbbb;
  --border:rgba(0,0,0,0.08); --border2:rgba(0,0,0,0.15);
}
body.day-rose {
  --bg:#f7f7f8; --bg2:#efefef; --bg3:#ffffff; --bg4:#f2f2f2;
  --surface:#ffffff; --surface2:#f7f7f8;
  --accent:#c0000d; --accent2:#9a0009; --accent-dim:rgba(192,0,13,0.08); --accent-glow:rgba(192,0,13,0.25);
  --gold:#c07000; --gold-dim:rgba(192,112,0,0.12);
  --red:#c0000d; --red-dim:rgba(192,0,13,0.1);
  --blue:#1d4ed8; --blue-dim:rgba(29,78,216,0.1);
  --text:#111111; --text2:#555555; --text3:#bbbbbb;
  --border:rgba(0,0,0,0.08); --border2:rgba(0,0,0,0.15);
}
body.day-mint,body.day-sky,body.day-rose{
  background-image:none;
}
/* theme button overrides per light theme */
body.day-mint .theme-btn,body.day-sky .theme-btn,body.day-rose .theme-btn{background:#c0000d;border-color:#9a0009;color:#fff;}
body.day-mint .theme-btn-dot,body.day-sky .theme-btn-dot,body.day-rose .theme-btn-dot{background:#fff;}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;transition:background .4s ease,color .4s ease;background-image:radial-gradient(ellipse at 20% 15%,rgba(77,100,255,0.13) 0%,transparent 50%),radial-gradient(ellipse at 80% 85%,rgba(255,107,107,0.09) 0%,transparent 50%);}
body::before{content:'';position:fixed;top:-200px;left:-100px;width:600px;height:600px;background:radial-gradient(circle,rgba(77,100,255,0.1) 0%,transparent 65%);pointer-events:none;z-index:0;transition:opacity .4s;}
body::after{content:'';position:fixed;bottom:-150px;right:-100px;width:500px;height:500px;background:radial-gradient(circle,rgba(255,107,107,0.08) 0%,transparent 65%);pointer-events:none;z-index:0;transition:opacity .4s;}
.app{position:relative;z-index:1;max-width:430px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;}
.hdr{padding:18px 18px 0;}
.hdr-inner{display:flex;align-items:center;justify-content:space-between;padding-bottom:16px;border-bottom:1px solid var(--border);}
.logo{display:flex;align-items:center;gap:11px;}
.logo-ico{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,#ff6b6b,#4d6fff);display:flex;align-items:center;justify-content:center;font-size:18px;box-shadow:0 4px 18px rgba(255,107,107,0.4);}
body.day-mint .logo-ico,body.day-sky .logo-ico,body.day-rose .logo-ico{background:linear-gradient(135deg,#c0000d,#7a0008);box-shadow:0 4px 18px rgba(192,0,13,0.3);}
.logo-t{font-size:14px;font-weight:700;letter-spacing:-.3px;}
.logo-s{font-size:10px;color:var(--text2);margin-top:1px;font-family:var(--mono);}
.hdr-chip{font-family:var(--mono);font-size:10px;background:var(--accent-dim);color:var(--accent);border:1px solid rgba(255,107,107,0.25);padding:5px 10px;border-radius:20px;}
.tabs{display:flex;margin:14px 18px;background:var(--bg3);border-radius:var(--r);padding:3px;gap:3px;border:1px solid var(--border);}
.tab{flex:1;padding:10px;border:none;border-radius:9px;font-family:var(--font);font-size:12px;font-weight:600;cursor:pointer;transition:all .22s ease;background:transparent;color:var(--text2);display:flex;align-items:center;justify-content:center;gap:6px;}
.tab.on{background:linear-gradient(135deg,var(--surface),var(--surface2));color:var(--accent);box-shadow:0 2px 10px rgba(0,0,0,.15);border:1px solid var(--accent-dim);}
body.day-mint .tab.on,body.day-sky .tab.on,body.day-rose .tab.on{box-shadow:0 2px 8px rgba(192,0,13,.12);}
.cnt{flex:1;padding:0 18px 32px;}
.scr{display:none;animation:fu .28s ease;}
.scr.on{display:block;}
@keyframes fu{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.slbl{font-size:10px;font-weight:700;letter-spacing:1.4px;color:var(--text3);text-transform:uppercase;margin:18px 0 10px;}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:14px;}
.scard{background:var(--bg3);border:1px solid var(--border);border-radius:var(--r);padding:13px 10px;text-align:center;position:relative;overflow:hidden;}
.scard::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;border-radius:var(--r) var(--r) 0 0;}
.scard.g::before{background:linear-gradient(90deg,#ff6b6b,#4d6fff);}
.scard.r::before{background:linear-gradient(90deg,var(--red),#ff8c69);}
.scard.b::before{background:linear-gradient(90deg,var(--blue),#a78bfa);}
.snum{font-size:22px;font-weight:700;font-family:var(--mono);}
.snum.g{color:var(--accent);}.snum.r{color:var(--red);}.snum.b{color:var(--blue);}
.slb{font-size:9px;color:var(--text2);margin-top:3px;}
.mlist{display:flex;flex-direction:column;gap:7px;}
.mcard{background:var(--bg3);border:1px solid var(--border);border-radius:var(--r2);padding:13px 15px;display:flex;align-items:center;gap:13px;cursor:pointer;transition:all .18s ease;position:relative;overflow:hidden;}
.mcard::after{content:'';position:absolute;inset:0;opacity:0;background:linear-gradient(90deg,rgba(255,107,107,0.07),transparent);transition:opacity .2s;pointer-events:none;}
.mcard:hover::after{opacity:1;}
.mcard:hover{border-color:rgba(255,107,107,.25);transform:translateX(2px);}
.mcard:active{transform:scale(.98);}
.av{width:42px;height:42px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0;}
.av.m{background:linear-gradient(135deg,#1a2d5e,#233575);color:var(--blue);border:1px solid rgba(77,159,255,.3);box-shadow:0 0 14px rgba(77,159,255,.22);}
.av.f{background:linear-gradient(135deg,#2a1535,#4d2060);color:#e879b5;border:1px solid rgba(232,121,181,.3);box-shadow:0 0 14px rgba(232,121,181,.25);}
body.day-mint .av.m,body.day-sky .av.m,body.day-rose .av.m{background:linear-gradient(135deg,#dce8ff,#c5d8ff);color:#1d4ed8;border:1px solid rgba(29,78,216,.25);box-shadow:none;}
body.day-mint .av.f,body.day-sky .av.f,body.day-rose .av.f{background:linear-gradient(135deg,#fce7f3,#fbd0e8);color:#be185d;border:1px solid rgba(190,24,93,.25);box-shadow:none;}
.mi{flex:1;min-width:0;}
.mn{font-size:13px;font-weight:600;letter-spacing:-.2px;}
.ms{font-size:11px;color:var(--text2);margin-top:2px;}
.mbar{height:3px;background:var(--bg2);border-radius:2px;margin-top:6px;overflow:hidden;}
.mbar-f{height:100%;border-radius:2px;background:linear-gradient(90deg,#ff6b6b,#4d6fff);transition:width .4s ease;}
.badge{font-family:var(--mono);font-size:10px;font-weight:600;padding:4px 9px;border-radius:20px;flex-shrink:0;}
.badge.g{background:var(--accent-dim);color:var(--accent);border:1px solid rgba(0,229,160,.18);}
.badge.w{background:var(--gold-dim);color:var(--gold);border:1px solid rgba(245,200,66,.18);}
.badge.r{background:var(--red-dim);color:var(--red);border:1px solid rgba(255,77,109,.18);}
.chv{color:var(--text3);font-size:15px;margin-left:2px;}
.back{display:inline-flex;align-items:center;gap:7px;background:var(--bg3);border:1px solid var(--border);color:var(--text2);font-family:var(--font);font-size:12px;padding:8px 14px;border-radius:var(--r);cursor:pointer;transition:all .18s;margin-bottom:14px;}
.back:hover{border-color:var(--border2);color:var(--text);}
.hero{background:var(--bg3);border:1px solid var(--border);border-radius:var(--r2);padding:18px;margin-bottom:11px;position:relative;overflow:hidden;}
.hero::before{content:'';position:absolute;top:-60px;right:-60px;width:170px;height:170px;border-radius:50%;background:radial-gradient(circle,rgba(0,229,160,0.07),transparent 70%);}
.hero-top{display:flex;align-items:center;gap:14px;margin-bottom:14px;}
.hero-av{width:62px;height:62px;border-radius:18px;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700;flex-shrink:0;box-shadow:0 6px 20px rgba(0,0,0,.35);}
.hero-name{font-size:17px;font-weight:700;letter-spacing:-.3px;}
.hero-sub{font-size:11px;color:var(--text2);margin-top:3px;}
.hero-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;}
.hst{text-align:center;}
.hst-n{font-size:19px;font-weight:700;font-family:var(--mono);}
.hst-l{font-size:9px;color:var(--text2);margin-top:2px;}
.hero-prog{margin-top:14px;background:var(--bg2);height:5px;border-radius:3px;overflow:hidden;}
.hero-bar{height:100%;background:linear-gradient(90deg,#ff6b6b,#4d6fff);border-radius:3px;transition:width .6s cubic-bezier(.34,1.56,.64,1);}
.yr-pill{display:inline-flex;background:var(--bg2);border:1px solid var(--border);border-radius:20px;padding:2px;gap:2px;margin-bottom:12px;}
.yr-pb{padding:5px 16px;border-radius:18px;font-family:var(--mono);font-size:11px;font-weight:700;cursor:pointer;border:none;background:transparent;color:var(--text2);transition:all .18s;}
.yr-pb.on{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;box-shadow:0 2px 8px var(--accent-glow);}
/* LIST STYLE — ahli payment view */
.mlist-view{display:flex;flex-direction:column;gap:0;background:var(--bg3);border:1px solid var(--border);border-radius:var(--r2);overflow:hidden;}
.mlist-row{display:flex;align-items:center;gap:10px;padding:9px 14px;border-bottom:1px solid var(--border);transition:background .15s;}
.mlist-row:last-child{border-bottom:none;}
.mlist-row.paid{background:rgba(0,200,100,.05);}
.mlist-row.late{background:rgba(255,59,48,.04);}
.mlist-row.fut{opacity:.4;}
.ml-num{font-family:var(--mono);font-size:10px;color:var(--text3);width:16px;flex-shrink:0;text-align:right;}
.ml-mo{font-size:12px;font-weight:600;width:36px;flex-shrink:0;}
.mlist-row.paid .ml-mo{color:#00c864;}
.mlist-row.late .ml-mo{color:#ff3b30;}
.mlist-row.fut .ml-mo{color:var(--text2);}
.ml-bar-wrap{flex:1;height:5px;background:var(--bg2);border-radius:3px;overflow:hidden;}
.ml-bar{height:100%;border-radius:3px;transition:width .5s ease;}
.mlist-row.paid .ml-bar{background:linear-gradient(90deg,#00c864,#00a050);}
.mlist-row.late .ml-bar{background:linear-gradient(90deg,#ff3b30,#ff6b6b);width:100%!important;}
.mlist-row.fut .ml-bar{background:var(--border2);}
.ml-info{display:flex;flex-direction:column;align-items:flex-end;flex-shrink:0;min-width:52px;}
.ml-st{font-family:var(--mono);font-size:9px;font-weight:700;}
.mlist-row.paid .ml-st{color:#00c864;}
.mlist-row.late .ml-st{color:#ff3b30;}
.mlist-row.fut .ml-st{color:var(--text3);}
.ml-date{font-family:var(--mono);font-size:9px;color:var(--text2);margin-top:1px;}
.ml-ico{font-size:13px;flex-shrink:0;width:18px;text-align:center;}
/* keep old mgrid for any other use */
.mgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;}
.mcell{background:var(--bg3);border:1px solid var(--border);border-radius:var(--r);padding:11px 8px;text-align:center;transition:all .18s;}
.mcell.paid{background:rgba(0,200,100,.12);border-color:rgba(0,200,100,.4);}
.mcell.late{background:rgba(255,59,48,.1);border-color:rgba(255,59,48,.35);}
.mcell.fut{opacity:.35;}
.mc-mo{font-size:10px;color:var(--text2);font-weight:600;}
.mcell.paid .mc-mo{color:#00c864;}
.mcell.late .mc-mo{color:#ff3b30;}
.mc-ico{font-size:17px;margin:4px 0;display:block;}
.mc-st{font-size:9px;font-family:var(--mono);color:var(--text3);}
.mcell.paid .mc-st{color:#00c864;}
.mcell.late .mc-st{color:#ff3b30;}
.mc-date{font-size:9px;font-family:var(--mono);color:rgba(0,200,100,.85);margin-top:2px;}
/* LOGIN */
.login-card{background:var(--bg3);border:1px solid var(--border);border-radius:var(--r2);padding:26px 22px;text-align:center;margin-top:6px;}
.lock-ico{width:60px;height:60px;border-radius:18px;background:linear-gradient(135deg,var(--bg2),var(--surface));border:1px solid var(--border2);display:flex;align-items:center;justify-content:center;font-size:26px;margin:0 auto 18px;position:relative;overflow:hidden;}
.lock-ico::after{content:'';position:absolute;top:-60%;left:-60%;width:50%;height:200%;background:linear-gradient(105deg,transparent 40%,rgba(255,255,255,0.45) 50%,transparent 60%);transform:translateX(-100%) rotate(15deg);pointer-events:none;}
.lock-ico.shining::after{animation:lock-shine 0.6s ease forwards;}
.lock-ico.glowing{box-shadow:0 0 0 6px rgba(255,201,71,0.18),0 4px 22px rgba(255,201,71,0.3);border-color:rgba(255,201,71,0.4);}
.lock-emoji{display:inline-block;transition:transform 0.2s ease;}
.lock-ico.bouncing .lock-emoji{animation:lock-bounce 0.35s cubic-bezier(.34,1.56,.64,1);}
@keyframes lock-shine{0%{transform:translateX(-100%) rotate(15deg);}100%{transform:translateX(400%) rotate(15deg);}}
@keyframes lock-bounce{0%{transform:scale(1);}40%{transform:scale(1.3);}100%{transform:scale(1);}}
.lt{font-size:17px;font-weight:700;margin-bottom:5px;}
.ls{font-size:12px;color:var(--text2);margin-bottom:22px;}
.pdots{display:flex;justify-content:center;gap:12px;margin-bottom:18px;}
.pd{width:13px;height:13px;border-radius:50%;border:2px solid var(--border2);transition:all .18s;}
.pd.on{background:var(--accent);border-color:var(--accent);box-shadow:0 0 9px var(--accent-glow);}
.pin-inp{width:100%;background:var(--bg2);border:1px solid var(--border2);border-radius:var(--r);color:var(--text);font-family:var(--font);font-size:20px;padding:13px 14px;outline:none;letter-spacing:10px;text-align:center;margin-bottom:10px;transition:border-color .18s;}
.pin-inp:focus{border-color:rgba(0,229,160,.45);}
.pin-inp.err{border-color:var(--red);animation:shk .28s ease;}
@keyframes shk{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.errmsg{font-size:11px;color:var(--red);margin-bottom:10px;min-height:15px;}
.btnmain{width:100%;padding:13px;background:linear-gradient(135deg,#ff6b6b,#4d6fff);color:#090e1c;font-family:var(--font);font-size:13px;font-weight:700;border:none;border-radius:var(--r);cursor:pointer;transition:all .18s;}
.btnmain:hover{opacity:.88;transform:translateY(-1px);box-shadow:0 5px 18px rgba(255,107,107,0.4);}
body.day-mint .btnmain,body.day-sky .btnmain,body.day-rose .btnmain{background:#c0000d;color:#fff;}
body.day-mint .btnmain:hover,body.day-sky .btnmain:hover,body.day-rose .btnmain:hover{box-shadow:0 5px 18px rgba(192,0,13,0.35);}
/* ADMIN TOPBAR */
.atop{display:flex;align-items:center;justify-content:space-between;background:var(--bg3);border:1px solid var(--border);border-radius:var(--r);padding:9px 13px;margin-bottom:12px;}
.adot-wrap{display:flex;align-items:center;gap:7px;font-size:12px;color:#ff6b6b;}
.adot{width:7px;height:7px;border-radius:50%;background:#ff6b6b;box-shadow:0 0 7px rgba(255,107,107,0.5);animation:pulse 2s infinite;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.lgout{font-size:11px;color:var(--text2);font-family:var(--font);background:var(--bg2);border:1px solid var(--border);padding:5px 11px;border-radius:20px;cursor:pointer;transition:all .18s;}
.lgout:hover{color:var(--red);border-color:rgba(255,77,109,.3);}
/* MONTH BARS */
.mbwrap{background:var(--bg3);border:1px solid var(--border);border-radius:var(--r2);padding:15px;margin-bottom:11px;}
.mbrow{display:flex;align-items:center;gap:9px;margin-bottom:6px;}
.mbrow:last-child{margin-bottom:0;}
.mbmo{font-family:var(--mono);font-size:10px;color:var(--text2);width:30px;flex-shrink:0;}
.mbbg{flex:1;height:7px;background:var(--bg2);border-radius:4px;overflow:hidden;}
.mbfill{height:100%;border-radius:4px;background:linear-gradient(90deg,#ff6b6b,#4d6fff);transition:width .5s ease;}
.mbval{font-family:var(--mono);font-size:10px;width:26px;text-align:right;flex-shrink:0;}
/* PAYMENT CHIPS */
.pay-hist{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px;}
.ph-chip{font-size:9px;font-family:var(--mono);padding:2px 7px;border-radius:20px;background:rgba(255,107,107,0.1);color:var(--accent);border:1px solid rgba(255,107,107,.18);}
/* ADMIN MONTH LIST */
.mtl{display:flex;flex-direction:column;border-radius:var(--r2);overflow:hidden;border:1px solid var(--border);}
.mtl-item{background:var(--bg3);border-bottom:1px solid var(--border);}
.mtl-item:last-child{border-bottom:none;}
.mtl-item.paid-row{background:rgba(255,107,107,0.04);}
.mtl-main{display:flex;align-items:center;gap:12px;padding:13px 15px;cursor:pointer;transition:background .15s;}
.mtl-main:hover{background:var(--surface);}
.mtl-mo{font-family:var(--mono);font-size:10px;color:var(--text3);width:20px;text-align:center;flex-shrink:0;}
.mtl-info{flex:1;}
.mtl-name{font-size:13px;font-weight:600;}
.mtl-sub{font-size:10px;color:var(--text2);margin-top:2px;font-family:var(--mono);}
.mtl-item.paid-row .mtl-sub{color:rgba(255,107,107,.7);}
.mtl-status{font-size:10px;font-weight:700;font-family:var(--mono);flex-shrink:0;min-width:36px;text-align:right;}
.mtl-item.paid-row .mtl-status{color:#ff6b6b;}
.mtl-item:not(.paid-row) .mtl-status{color:var(--text3);}
/* TOGGLE */
.tog{width:44px;height:25px;border-radius:13px;border:none;cursor:pointer;position:relative;transition:all .22s ease;flex-shrink:0;margin-left:8px;}
.tog.on{background:linear-gradient(135deg,#ff6b6b,#ff4757);box-shadow:0 0 12px rgba(255,107,107,0.45);}
.tog.off{background:var(--bg2);border:1px solid var(--border2);}
.tog::after{content:'';position:absolute;top:3px;width:17px;height:17px;border-radius:50%;background:#fff;transition:left .22s cubic-bezier(.34,1.56,.64,1);box-shadow:0 1px 3px rgba(0,0,0,.4);}
.tog.on::after{left:23px;}
.tog.off::after{left:3px;}
/* DATE PANEL */
.date-panel{overflow:hidden;max-height:0;transition:max-height .3s ease,opacity .25s ease;opacity:0;background:var(--bg4);border-top:1px solid var(--border);}
.date-panel.open{max-height:380px;opacity:1;}
.dp-inner{padding:14px 15px 16px;}
.dp-title{font-size:10px;font-weight:700;letter-spacing:1px;color:var(--text3);text-transform:uppercase;margin-bottom:11px;}
.dp-row{display:flex;align-items:center;gap:10px;margin-bottom:9px;}
.dp-lbl{font-size:11px;color:var(--text2);width:42px;flex-shrink:0;}
.dp-input{flex:1;background:var(--bg2);border:1px solid var(--border2);border-radius:8px;color:var(--text);font-family:var(--mono);font-size:13px;padding:8px 11px;outline:none;transition:border-color .18s;}
.dp-input:focus{border-color:rgba(0,229,160,.4);}
.dp-input[type=number]{-moz-appearance:textfield;}
.dp-input::-webkit-inner-spin-button{-webkit-appearance:none;}
.dp-presets{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:12px;}
.pre-lbl{font-size:9px;color:var(--text3);align-self:center;margin-right:2px;}
.preset{font-size:10px;font-family:var(--mono);padding:4px 9px;border-radius:20px;border:1px solid var(--border2);background:var(--bg3);color:var(--text2);cursor:pointer;transition:all .15s;}
.preset:hover{border-color:rgba(0,229,160,.35);color:var(--accent);background:var(--accent-dim);}
.preset.today-pre{border-color:rgba(255,201,71,.3);color:var(--gold);background:rgba(255,201,71,.08);}
.dp-btns{display:flex;gap:7px;}
.dp-save{flex:1;padding:9px;background:linear-gradient(135deg,#ff6b6b,#4d6fff);color:#fff;border:none;border-radius:8px;font-family:var(--font);font-size:12px;font-weight:700;cursor:pointer;transition:all .18s;}
.dp-save:hover{opacity:.88;}
.dp-clear{padding:9px 13px;background:var(--red-dim);color:var(--red);border:1px solid rgba(255,77,109,.2);border-radius:8px;font-family:var(--font);font-size:12px;font-weight:600;cursor:pointer;transition:all .18s;}
.dp-clear:hover{background:rgba(255,77,109,.2);}
/* NOTIF */
.notif{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(70px);background:var(--surface2);border:1px solid var(--border2);color:var(--text);font-size:12px;font-weight:500;padding:11px 18px;border-radius:var(--r3);box-shadow:0 6px 28px rgba(0,0,0,.55);z-index:999;transition:transform .32s cubic-bezier(.34,1.56,.64,1);white-space:nowrap;display:flex;align-items:center;gap:9px;max-width:calc(100vw - 36px);}
.notif.show{transform:translateX(-50%) translateY(0);}
.ni{font-size:15px;}
/* HINT */
.hint{font-size:11px;color:var(--text2);background:var(--bg3);border:1px solid var(--border);border-radius:var(--r);padding:10px 13px;margin-bottom:12px;line-height:1.5;}
.hint b{color:#ff6b6b;font-weight:600;}
/* CALENDAR PICKER */
.cal-wrap{margin-bottom:10px;}
.cal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
.cal-nav{background:var(--bg2);border:1px solid var(--border2);color:var(--text);width:30px;height:30px;border-radius:8px;cursor:pointer;font-size:15px;display:flex;align-items:center;justify-content:center;transition:all .15s;}
.cal-nav:hover{border-color:rgba(0,200,100,.4);color:#00c864;}
.cal-month-lbl{font-size:11px;font-weight:700;font-family:var(--mono);color:var(--text);letter-spacing:.5px;}
.cal-days-header{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-bottom:4px;}
.cal-day-lbl{font-size:9px;text-align:center;color:var(--text3);font-family:var(--mono);padding:2px 0;}
.cal-days{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;}
.cal-day{font-size:11px;font-family:var(--mono);padding:5px 2px;border-radius:6px;border:1px solid transparent;background:transparent;color:var(--text2);cursor:pointer;text-align:center;transition:all .15s;}
.cal-day:hover:not(.cal-empty):not(.cal-disabled){background:var(--accent-dim);color:var(--accent);border-color:rgba(255,107,107,.3);}
.cal-day.cal-selected{background:linear-gradient(135deg,#00c864,#00a050);color:#fff;border-color:transparent;font-weight:700;}
.cal-day.cal-today{border-color:var(--gold);color:var(--gold);}
.cal-day.cal-empty{cursor:default;}
.cal-day.cal-disabled{opacity:.3;cursor:default;}
/* WHATSAPP */
.dp-wa{flex:1;padding:9px;background:linear-gradient(135deg,#25d366,#128c7e);color:#fff;border:none;border-radius:8px;font-family:var(--font);font-size:12px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;transition:all .18s;}
.dp-wa:hover{opacity:.88;}
.dp-wa-ico{font-size:14px;}
/* PHONE FIELD */
.phone-row{display:flex;align-items:center;gap:8px;margin-top:10px;}
.phone-ico{font-size:14px;flex-shrink:0;}
.phone-input{flex:1;background:var(--bg2);border:1px solid var(--border2);border-radius:8px;color:var(--text);font-family:var(--mono);font-size:12px;padding:7px 10px;outline:none;transition:border-color .18s;}
.phone-input:focus{border-color:rgba(37,211,102,.5);}
.phone-input::placeholder{color:var(--text3);}
.phone-save{padding:7px 12px;background:rgba(37,211,102,.15);color:#25d366;border:1px solid rgba(37,211,102,.3);border-radius:8px;font-family:var(--font);font-size:11px;font-weight:600;cursor:pointer;transition:all .15s;white-space:nowrap;}
.phone-save:hover{background:rgba(37,211,102,.25);}
::-webkit-scrollbar{width:4px;}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px;}

/* TRANSITION for day/night */
*{transition:background-color .35s ease,color .3s ease,border-color .3s ease;}
.mbar-f,.hero-bar,.mbfill{transition:width .4s ease,background .35s ease!important;}

/* THEME BLINK BUTTON */
.theme-btn{position:relative;padding:5px 12px;border-radius:20px;border:1px solid rgba(255,255,255,0.2);cursor:pointer;font-size:11px;font-weight:700;font-family:var(--mono);letter-spacing:.5px;background:linear-gradient(135deg,rgba(77,100,255,0.25),rgba(255,107,107,0.2));color:var(--text);transition:all .22s ease;display:flex;align-items:center;gap:6px;}
.theme-btn:hover{transform:scale(1.04);}
.theme-btn-dot{width:7px;height:7px;border-radius:50%;background:#a0c4ff;animation:blink-dot 1.5s infinite;}
@keyframes blink-dot{0%,100%{opacity:1;box-shadow:0 0 0 0 rgba(160,196,255,0.6);}50%{opacity:.3;box-shadow:0 0 0 4px rgba(160,196,255,0);}}
@keyframes blink-dot-day{0%,100%{opacity:1;box-shadow:0 0 0 0 rgba(10,158,110,0.6);}50%{opacity:.3;box-shadow:0 0 0 4px rgba(10,158,110,0);}}
/* Pulse ring on toggle */
.theme-btn::after{content:'';position:absolute;inset:-4px;border-radius:24px;border:2px solid transparent;transition:border-color .2s ease,transform .2s ease;}
.theme-btn:active::after{border-color:rgba(255,107,107,0.5);transform:scale(1.1);}

/* ZOOM MODAL */
.zoom-modal{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,0);transition:background .3s ease;pointer-events:none;}
.zoom-modal.open{background:rgba(0,0,0,0.88);pointer-events:all;}
.zoom-modal-wrap{transform:scale(0.5) translateY(40px);opacity:0;transition:transform .38s cubic-bezier(.34,1.56,.64,1),opacity .3s ease;display:flex;flex-direction:column;align-items:center;gap:14px;}
.zoom-modal.open .zoom-modal-wrap{transform:scale(1) translateY(0);opacity:1;}
.zoom-modal-img{display:block;max-width:88vw;max-height:78vh;object-fit:contain;border-radius:20px;box-shadow:0 30px 80px rgba(0,0,0,.7);}
.zoom-name{color:rgba(255,255,255,.9);font-size:15px;font-weight:600;letter-spacing:.3px;text-align:center;}
.zoom-close{width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,0.12);border:1px solid rgba(255,255,255,.2);color:#fff;font-size:20px;cursor:pointer;display:none;align-items:center;justify-content:center;transition:all .18s;position:absolute;top:20px;right:20px;}
.zoom-modal.open .zoom-close{display:flex;}
.zoom-close:hover{background:rgba(255,107,107,0.4);border-color:rgba(255,107,107,.4);}
</style>
</head>

// ── LOCKOUT SYSTEM ────────────────────────────────────────────
const LOCK_MAX=4, LOCK_DURATION=5*60*1000; // 4 cubaan, 5 minit
const lockState={attempts:0, lockedUntil:null, timer:null};

function isLocked(){
  if(!lockState.lockedUntil) return false;
  if(Date.now()<lockState.lockedUntil) return true;
  // lock dah tamat, reset
  lockState.attempts=0; lockState.lockedUntil=null;
  return false;
}

function recordFailedAttempt(errElId){
  lockState.attempts++;
  const remaining=LOCK_MAX-lockState.attempts;
  if(lockState.attempts>=LOCK_MAX){
    lockState.lockedUntil=Date.now()+LOCK_DURATION;
    showLockout(errElId);
  } else {
    const el=document.getElementById(errElId);
    if(el) el.textContent=`No. gaji tidak betul. ${remaining} cubaan lagi sebelum dikunci.`;
  }
}

function showLockout(errElId){
  clearInterval(lockState.timer);
  const inp=document.getElementById('pinInp')||document.getElementById('staffNoInp');
  const btn=document.querySelector('.btnmain');
  if(inp){inp.disabled=true;inp.value='';inp.style.borderColor='rgba(255,77,109,.5)';}
  if(btn){btn.disabled=true;btn.style.opacity='0.4';}
  updateLockMsg(errElId);
  lockState.timer=setInterval(()=>{
    if(!isLocked()){
      clearInterval(lockState.timer);
      // re-render whichever screen
      if(document.getElementById('pinInp')) renderAdmLogin();
      else renderAhliList();
    } else {
      updateLockMsg(errElId);
    }
  },1000);
}

function updateLockMsg(errElId){
  const el=document.getElementById(errElId);
  if(!el) return;
  const ms=lockState.lockedUntil-Date.now();
  const m=Math.floor(ms/60000), s=Math.floor((ms%60000)/1000);
  el.innerHTML=`🔒 Sistem dikunci. Cuba semula dalam <b>${m}:${String(s).padStart(2,'0')}</b>`;
  el.style.color='var(--red)';
}

// ── SYNC STATUS INDICATOR ─────────────────────────────────────
function showSyncStatus(msg, ok=true){
  const el = document.getElementById('sync-status');
  if(!el) return;
  el.textContent = msg;
  el.style.color = ok ? '#00c864' : '#ff6b6b';
  clearTimeout(el._t);
  el._t = setTimeout(()=>{ el.textContent = SYNC_ENABLED ? '⬤ Data Connected' : '⚠ Offline (tiada URL)'; el.style.color = SYNC_ENABLED ? '#00c864' : '#ffc947'; }, 3000);
}

// ── HELPER: JSONP fetch untuk bypass CORS ────────────────────
function fetchJSONP(url) {
  return new Promise((resolve, reject) => {
    const cbName = 'pq_cb_' + Date.now();
    const script = document.createElement('script');
    const timeout = setTimeout(() => {
      delete window[cbName];
      if(document.body.contains(script)) document.body.removeChild(script);
      reject(new Error('JSONP timeout'));
    }, 10000);
    window[cbName] = (data) => {
      clearTimeout(timeout);
      delete window[cbName];
      if(document.body.contains(script)) document.body.removeChild(script);
      resolve(data);
    };
    script.src = url + '&callback=' + cbName;
    script.onerror = () => { clearTimeout(timeout); reject(new Error('Script load error')); };
    document.body.appendChild(script);
  });
}

// ── LOAD DATA: Cuba dari Sheets, fallback ke localStorage ─────
async function loadData(){
  S.data={};
  ['2025','2026'].forEach(yr=>{
    const raw=localStorage.getItem('pq3_'+yr);
    S.data[yr]=raw?JSON.parse(raw):JSON.parse(JSON.stringify(INIT[yr]));
  });

  if(!SYNC_ENABLED){ return; }

  try {
    showSyncStatus('⟳ Connecting...',true);
    const json = await fetchJSONP(SHEETS_URL+'?action=getData');
    if(json.success && json.data){
      ['2025','2026'].forEach(yr=>{
        if(json.data[yr]){
          MEMBERS.forEach(m=>{
            if(json.data[yr][m.id]) S.data[yr][m.id] = json.data[yr][m.id];
          });
        }
      });
      ['2025','2026'].forEach(yr=>localStorage.setItem('pq3_'+yr,JSON.stringify(S.data[yr])));
      showSyncStatus('⬤ Data Connected',true);
      if(S.tab==='ahli') renderAhliList();
      else renderAdmin();

      // Seed Jan & Feb 2026 ke Sheets jika masih kosong
      await seedPaid2026();
    }
  } catch(err){
    showSyncStatus('⚠ Gagal sambung ke Sheets (guna cache)',false);
    console.warn('Sheets sync error:',err);
  }
}

// ── SEED: Push Jan & Feb 2026 ke Sheets jika belum ada ──────────
async function seedPaid2026(){
  if(!SYNC_ENABLED) return;
  const seedMonths = ['01','02'];
  for(const m of MEMBERS){
    for(const mk of seedMonths){
      const entry = S.data['2026']?.[m.id]?.paid?.[mk];
      if(!entry) {
        // belum ada dalam Sheets — push dari INIT
        const initEntry = INIT['2026']?.[m.id]?.paid?.[mk];
        if(initEntry){
          try {
            const url = SHEETS_URL+'?action=setPaid&yr=2026&id='+encodeURIComponent(m.id)+'&mk='+encodeURIComponent(mk)+'&date='+encodeURIComponent(initEntry.date)+'&note=';
            await fetchJSONP(url);
          } catch(e){ console.warn('seedPaid2026 error:',e); }
        }
      }
    }
  }
}


function save(yr){
  localStorage.setItem('pq3_'+yr,JSON.stringify(S.data[yr]));
}

function getEntry(yr,id,mk){return S.data[yr]?.[id]?.paid?.[mk]||null;}
function isPaid(yr,id,mk){return !!getEntry(yr,id,mk);}

async function setPaid(yr,id,mk,date,note){
  if(!S.data[yr][id])S.data[yr][id]={paid:{}};
  S.data[yr][id].paid[mk]={date:parseInt(date),note:note||''};
  save(yr);
  if(!SYNC_ENABLED) return;
  // Fire-and-forget — jangan block UI, simpan local dulu terus
  showSyncStatus('⟳ Syncing...',true);
  fetchJSONP(SHEETS_URL+'?action=setPaid&yr='+encodeURIComponent(yr)+'&id='+encodeURIComponent(id)+'&mk='+encodeURIComponent(mk)+'&date='+encodeURIComponent(date)+'&note='+encodeURIComponent(note||''))
    .then(()=>showSyncStatus('✓ Disimpan',true))
    .catch(()=>showSyncStatus('⚠ Sheets offline (data saved locally)',false));
}

async function clearPaid(yr,id,mk){
  if(S.data[yr]?.[id]?.paid) delete S.data[yr][id].paid[mk];
  save(yr);
  if(!SYNC_ENABLED) return;
  // Fire-and-forget
  showSyncStatus('⟳ Syncing...',true);
  fetchJSONP(SHEETS_URL+'?action=clearPaid&yr='+encodeURIComponent(yr)+'&id='+encodeURIComponent(id)+'&mk='+encodeURIComponent(mk))
    .then(()=>showSyncStatus('✓ Rekod dipadam',true))
    .catch(()=>showSyncStatus('⚠ Sheets offline (data saved locally)',false));
}

function doAhliLogin(){
  if(isLocked()){showLockout('ahliErr');return;}
  const sel=document.getElementById('ahliSelect').value;
  const inp=document.getElementById('staffNoInp');
  if(!sel||!inp) return;
  const m=MEMBERS.find(x=>x.id===sel);
  if(!m) return;
  if(inp.value.trim()===m.staffNo){
    lockState.attempts=0;lockState.lockedUntil=null;
    inp.style.borderColor='rgba(0,200,100,.5)';
    S.ahliMember=sel; S.ahliYear='2026';
    setTimeout(()=>{
      document.getElementById('ahli-list').style.display='none';
      renderAhliDetail();
      document.getElementById('ahli-detail').style.display='block';
    },200);
  } else {
    inp.style.borderColor='rgba(255,77,109,.6)';
    inp.style.animation='shk .28s ease';
    setTimeout(()=>inp.style.animation='',300);
    inp.value='';
    recordFailedAttempt('ahliErr');

}

function updateReminderState(){
  const chips=[...document.querySelectorAll('.remind-chip.remind-on')];
  const count=chips.length;
  const countEl=document.getElementById('selectedCount');
  const sendBtn=document.getElementById('sendReminderBtn');
  const allBtn=document.getElementById('selectAllBtn');
  const total=document.querySelectorAll('.remind-chip').length;
  if(countEl) countEl.textContent=count+' dipilih';
  if(sendBtn){sendBtn.disabled=count===0;sendBtn.style.opacity=count>0?'1':'0.4';sendBtn.style.cursor=count>0?'pointer':'default';}
  if(allBtn) allBtn.textContent=count===total?'Nyahpilih Semua':'Pilih Semua';
}

function toggleAllRemind(){
  const chips=[...document.querySelectorAll('.remind-chip')];
  const allOn=chips.every(c=>c.classList.contains('remind-on'));
  chips.forEach(chip=>{
    if(allOn){
      chip.classList.remove('remind-on');
      chip.style.background='var(--bg2)';chip.style.borderColor='var(--border2)';chip.style.color='var(--text2)';
    } else {
      chip.classList.add('remind-on');
      chip.style.background='rgba(37,211,102,0.2)';chip.style.borderColor='rgba(37,211,102,0.6)';chip.style.color='#25d366';
    }
  });
  updateReminderState();
}

function togPanel(pk){
  S.openPanel=S.openPanel===pk?null:pk;
  // init calendar state for this panel if needed
  if(S.openPanel===pk){
    const parts=pk.split('_'); // id_mk_yr
    const yr=parts[2], mk=parts[1];
    const mid=parts[0];
    const e=getEntry(yr,mid,mk);
    const monthIdx=MK.indexOf(mk);
    if(!S.calState)S.calState={};
    S.calState[pk]={
      year:parseInt(yr),
      month:monthIdx,
      selected:e?e.date:null
    };
  }
  renderAdmDetail();
  if(S.openPanel===pk) setTimeout(()=>renderCal(pk),40);
}

// Calendar state: S.calState[pk] = {year, month, selected}
function renderCal(pk){
  const wrap=document.getElementById('calwrap_'+pk);
  if(!wrap) return;
  if(!S.calState||!S.calState[pk]) return;
  const cs=S.calState[pk];
  const year=cs.year, month=cs.month, sel=cs.selected;
  const DNAMES=['Ah','Is','Se','Ra','Kh','Ju','Sa'];
  const MNAMES=['Januari','Februari','Mac','April','Mei','Jun','Julai','Ogos','September','Oktober','November','Disember'];
  const firstDay=new Date(year,month,1).getDay(); // 0=Sun
  const daysInMonth=new Date(year,month+1,0).getDate();
  const todayD=new Date();
  const isToday=(d)=>todayD.getFullYear()===year&&todayD.getMonth()===month&&todayD.getDate()===d;

  let cells='';
  for(let i=0;i<firstDay;i++) cells+=`<button class="cal-day cal-empty" disabled></button>`;
  for(let d=1;d<=daysInMonth;d++){
    const isSel=sel===d;
    const isTod=isToday(d);
    cells+=`<button class="cal-day${isSel?' cal-selected':''}${isTod&&!isSel?' cal-today':''}" onclick="selCalDay('${pk}',${d})">${d}</button>`;
  }

  wrap.innerHTML=`
    <div class="cal-header">
      <button class="cal-nav" onclick="calNav('${pk}',-1)">‹</button>
      <span class="cal-month-lbl">${MNAMES[month]} ${year}</span>
      <button class="cal-nav" onclick="calNav('${pk}',1)">›</button>
    </div>
    <div class="cal-days-header">${DNAMES.map(d=>`<div class="cal-day-lbl">${d}</div>`).join('')}</div>
    <div class="cal-days">${cells}</div>`;
}

function calNav(pk,dir){
  if(!S.calState||!S.calState[pk]) return;
  const cs=S.calState[pk];
  cs.month+=dir;
  if(cs.month>11){cs.month=0;cs.year++;}
  if(cs.month<0){cs.month=11;cs.year--;}
  renderCal(pk);
}

function selCalDay(pk,d){
  if(!S.calState||!S.calState[pk]) return;
  S.calState[pk].selected=d;
  renderCal(pk);
}
function setP(pk,day){
  if(!S.calState)S.calState={};
  if(!S.calState[pk]){const parts=pk.split('_');S.calState[pk]={year:parseInt(parts[2]),month:MK.indexOf(parts[1]),selected:null};}
  S.calState[pk].selected=day;
  renderCal(pk);
}
const FULLMONTHS=['Januari','Februari','Mac','April','Mei','Jun','Julai','Ogos','September','Oktober','November','Disember'];

function buildWaMsg(id,yr,mk,idx){
  const m=MEMBERS.find(x=>x.id===id);
  if(!m) return null;
  const e=getEntry(yr,id,mk);
  if(!e) return null;
  const day=e.date;
  const monthName=FULLMONTHS[idx];
  const nota=e.note?e.note:'tunai';
  return `Assalamualaikum ${m.name},\n\nBayaran yuran Petanque secara ${nota} bagi bulan ${monthName} ${yr} telah diterima dan direkodkan.\n\nTarikh: ${day} ${monthName} ${yr}\n\nJumlah: RM50.00\n\nTerima kasih 🙏\n\n🔗 Semak status pembayaran anda:\nhttps://kpmim.github.io/yuran/mobile.html`;
}

function sendReminder(memberName, months, yr){

}
function savePhone(id){
  const inp=document.getElementById('phone_'+id);
  if(!inp) return;
  const num=inp.value.replace(/\D/g,'');
  if(!num){notif('Nombor tidak sah','⚠️');return;}
  if(!S.phones) S.phones={};
  S.phones[id]=num;
  // also persist in localStorage
  localStorage.setItem('pq_phones',JSON.stringify(S.phones));
  notif('Nombor disimpan ✓','📱');
}
function previewPhone(id){/* live preview only */}

function openWa(id,yr,mk,idx){
  const msg=buildWaMsg(id,yr,mk,idx);
  if(!msg){notif('Bayaran belum disahkan','⚠️');return;}
  const m=MEMBERS.find(x=>x.id===id);
  if(!S.phones) S.phones={};
  const phone=(S.phones[id]||m.phone||'').replace(/\D/g,'');
  if(!phone){
    notif('Sila isi nombor WhatsApp dahulu','⚠️');
    const inp=document.getElementById('phone_'+id);
    if(inp){inp.focus();inp.style.borderColor='rgba(255,107,107,.6)';}
    return;
  }
  window.open(`https://wa.me/${phone}?text=${encodeURIComponent(msg)}`,'_blank');
}

function savePd(yr,id,mk,pk,idx){
  const ni=document.getElementById('dpn_'+pk);

  if(!day){notif('Sila pilih tarikh di kalendar','⚠️');return;}
  setPaid(yr,id,mk,day,note);

}

  } else {
    setPaid(yr,id,mk,25,'');

  const isLight=document.body.classList.contains('day-mint');

function toggleThemePicker(){}

function closeZoom(e, force){

  document.getElementById('zoomModal').classList.remove('open');

}
document.addEventListener('keydown', e => { if(e.key==='Escape') closeZoom(null,true); });

// ── LOCK ICON ANIMATION SEQUENCE ─────────────────────────────
function runLockSequence(){
  const icons = document.querySelectorAll('.lock-ico');
  if(!icons.length) return;
  icons.forEach(ico => {
    const emoji = ico.querySelector('.lock-emoji');
    if(!emoji) return;

    // Reset
    ico.classList.remove('shining','glowing','bouncing');
    emoji.textContent = '🔐';

    // Step 1: Shine (0ms)
    setTimeout(()=>{
      ico.classList.add('shining','glowing');
    }, 0);

    // Step 2: Remove shine class after animation done, keep glow
    setTimeout(()=>{
      ico.classList.remove('shining');
    }, 650);

    // Step 3: Unlock (900ms)
    setTimeout(()=>{
      ico.classList.add('bouncing');
      emoji.textContent = '🔓';
    }, 900);

    // Step 4: Remove bounce class
    setTimeout(()=>{
      ico.classList.remove('bouncing');
    }, 1250);

    // Step 5: Lock semula (1800ms)
    setTimeout(()=>{
      ico.classList.add('bouncing');
      emoji.textContent = '🔐';
    }, 1800);

    // Step 6: Done — remove glow & bounce
    setTimeout(()=>{
      ico.classList.remove('bouncing','glowing');
    }, 2200);
  });
}

// Jalankan sequence setiap 4 saat
setInterval(runLockSequence, 4000);
